[package]
name = "giftray"
version = "0.0.0"
description = "GIFTray desktop P0 spike"
authors = ["GIFTray contributors"]
edition = "2021"
license = "MPL-2.0"

[lib]
name = "giftray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-clipboard-manager = "2.4.2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.53.3", features = ["net", "time"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }
